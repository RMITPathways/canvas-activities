<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline Sorting Activity</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: transparent;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .activity-container {
        width: 100%;
        max-width: 100%;
        background: #fff;
        padding: 20px 5px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        overflow-x: hidden;
    }

    .slots-container {
        display: flex;
        justify-content: space-between;
        align-items: stretch;
        width: 100%;
        margin-bottom: 0;
    }

    .slot {
        width: 16%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .card-container {
        width: 100%;
        min-height: 160px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding: 2px;
        border: 2px dashed transparent;
        transition: border-color 0.2s;
    }

    .card-container.drag-over {
        border-color: #000154;
        border-radius: 4px;
        background-color: #f0f4ff;
    }

    .card {
        width: 100%;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 4px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        cursor: grab;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.2s, border 0.2s;
    }

    .card:active {
        cursor: grabbing;
    }

    .card.dragging {
        opacity: 0.5;
        transform: scale(0.95);
    }

    .card.correct { border: 2px solid #27ae60; }
    .card.incorrect { border: 2px solid #e74c3c; }

    .card img {
        width: 100%;
        height: 80px;
        object-fit: cover;
        border-radius: 2px;
        background-color: #eee;
    }

    .card-title {
        font-size: 12px;
        line-height: 1.2;
        text-align: center;
        margin-top: 5px;
        color: #000154;
        font-weight: bold;
        /* Force text to max 2 lines */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 2.4em; 
    }

    .tick {
        width: 3px;
        height: 30px;
        background-color: #000154;
        margin-top: 8px;
    }

    .timeline-wrapper {
        position: relative;
        width: 100%;
        margin-top: -2px;
    }

    .timeline-line {
        height: 16px;
        background-color: #c71f23;
        width: calc(100% - 10px);
        position: relative;
    }

    .timeline-arrow {
        position: absolute;
        right: -10px;
        top: -8px;
        width: 0; 
        height: 0; 
        border-top: 16px solid transparent;
        border-bottom: 16px solid transparent;
        border-left: 16px solid #c71f23;
    }

    .timeline-label {
        text-align: center;
        margin-top: 10px;
        color: #000154;
        font-weight: bold;
    }

    .timeline-dates {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: 5px;
    }

    .date-label {
        width: 16%;
        text-align: center;
        font-size: 11px;
        color: #333;
        line-height: 1.4;
        opacity: 0;
        transition: opacity 0.3s ease-in;
    }

    .date-label.show {
        opacity: 1;
    }

    .controls {
        margin-top: 20px;
        display: flex;
        justify-content: center;
    }

    button {
        background-color: #3498db;
        color: #fff;
        border: none;
        padding: 8px 20px;
        font-size: 14px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
    }

    button:hover { background-color: #2980b9; }
</style>
</head>

    <div class="timeline-wrapper">
        <div class="timeline-line">
            <div class="timeline-arrow"></div>
        </div>
    </div>
    <div class="timeline-label">time</div>
    
    <div class="timeline-dates" id="timeline-dates">
        <div class="date-label"><strong>2500 BC</strong><br>(146 m)</div>
        <div class="date-label"><strong>1311</strong><br>(160 m)</div>
        <div class="date-label"><strong>1889</strong><br>(300 m)</div>
        <div class="date-label"><strong>1931</strong><br>(381 m)</div>
        <div class="date-label"><strong>1975</strong><br>(533 m)</div>
        <div class="date-label"><strong>2007</strong><br>(830 m)</div>
    </div>

    <div class="controls">
        <button id="check-btn">✔ Check</button>
    </div>
</div>

<script>
    const cards = document.querySelectorAll('.card');
    const cardContainers = document.querySelectorAll('.card-container');
    const checkBtn = document.getElementById('check-btn');
    const dateLabels = document.querySelectorAll('.date-label');
    
    let draggedCard = null;

    cards.forEach(card => {
        card.addEventListener('dragstart', function(e) {
            draggedCard = this;
            setTimeout(() => this.classList.add('dragging'), 0);
            
            // Clear validation visuals on interaction
            cards.forEach(c => c.classList.remove('correct', 'incorrect'));
            dateLabels.forEach(label => label.classList.remove('show'));
        });

        card.addEventListener('dragend', function() {
            this.classList.remove('dragging');
            draggedCard = null;
        });
    });

    cardContainers.forEach(container => {
        container.addEventListener('dragover', function(e) {
            e.preventDefault(); 
            this.classList.add('drag-over');
        });

        container.addEventListener('dragleave', function() {
            this.classList.remove('drag-over');
        });

        container.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('drag-over');

            if (draggedCard && this !== draggedCard.parentNode) {
                let originalContainer = draggedCard.parentNode;
                let targetCard = this.querySelector('.card');

                if (targetCard) originalContainer.appendChild(targetCard);
                this.appendChild(draggedCard);
            }
        });
    });

    checkBtn.addEventListener('click', () => {
        const slots = document.querySelectorAll('.slot');
        
        slots.forEach((slot, index) => {
            const expectedId = slot.getAttribute('data-expected');
            const cardInSlot = slot.querySelector('.card');
            
            if (cardInSlot) {
                const actualId = cardInSlot.getAttribute('data-id');
                cardInSlot.classList.remove('correct', 'incorrect');
                
                if (expectedId === actualId) {
                    cardInSlot.classList.add('correct');
                    // Show date only for correct matches
                    dateLabels[index].classList.add('show');
                } else {
                    cardInSlot.classList.add('incorrect');
                    // Hide date for incorrect matches
                    dateLabels[index].classList.remove('show');
                }
            } else {
                dateLabels[index].classList.remove('show');
            }
        });
    });
</script>
